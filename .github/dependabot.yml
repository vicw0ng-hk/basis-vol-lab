# Dependabot version updates.
#
# Security updates already ran here before this file existed -- they need no
# config, and five of them have merged (#1, #2, #16, #17, #19). What this file
# adds is *version* updates: bumps for dependencies that are merely behind,
# rather than only those with an advisory against them.
#
# Every `groups` block below therefore leaves security updates alone. Omitting
# `applies-to` defaults a group to version updates only, so the existing
# security behaviour is untouched.
#
# WHERE THESE RUN: `ubuntu-latest`, same as every other job in `ci.yml`, and
# deliberately not the Mac mini / CodeBuild chain that hypertrade uses. This
# repo is public, which inverts both halves of that trade: Actions minutes are
# free and unlimited for public repos on standard runners, so there is no tier to
# protect; and GitHub is explicit that self-hosted runners "should almost never
# be used for public repositories," because any user can open a pull request and
# a persistent runner "can be persistently compromised by untrusted code in a
# workflow." The runners on the box are persistent, not ephemeral.
version: 2
updates:
  # Root only: one `uv.lock` for the whole workspace, and `[tool.uv.workspace]`
  # lists `packages/*` and `apps/*`, so this entry already covers every member.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]

  # `bun`, not `npm`: the lockfile is `bun.lock` (lockfileVersion 1) and bun is
  # its own ecosystem value with its own resolver.
  #
  # Note the asymmetry -- bun supports version updates but NOT security updates,
  # so a vulnerable dependency in here raises nothing by itself. This entry is
  # the only thing that moves `apps/web`, which makes staying current the
  # security mechanism rather than a tidiness preference.
  #
  # `package.json` pins `"vite": "npm:rolldown-vite@^7.3.1"`, an aliased
  # package. If a bump here resolves to the wrong thing, that alias is the first
  # suspect.
  - package-ecosystem: "bun"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      web:
        patterns: ["*"]

  # Base images in both Dockerfiles: python:3.14-slim (api builder + runtime),
  # oven/bun:1.3-alpine and nginx:1.27-alpine (web). `directories` plural is
  # required for a list -- the singular key takes one path and no globbing.
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]

  # `/` covers `.github/workflows` plus any root-level action manifest; the
  # workflow directory is not named explicitly, by design of the ecosystem.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # Provider and module constraints in the `.tf` files. Does not touch state and
  # cannot apply anything.
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      terraform:
        patterns: ["*"]
